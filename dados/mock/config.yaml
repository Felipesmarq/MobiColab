    fonte: "Suposição. Ordem de grandeza de um piloto concentrado em poucas linhas (spec, seção 10)."
  dispersao_atividade:
    valor: 1.0
    fonte: "Suposição. Desvio-padrão (escala log) da atividade dos usuários: poucos relatam muito e muitos relatam pouco, como em plataformas colaborativas."
  atividade_troll:
    valor: 4.0
    fonte: "Suposição. Quantas vezes um troll relata mais que um usuário típico, para a EDA achar volume anômalo (RD04)."
  fracao_trolls:
    valor: 0.02
    fonte: "Suposição. Pequena fração de usuários que relata ao acaso, para a EDA ter anomalias a encontrar (RD04) e a moderação ter o que revisar (RF07)."

