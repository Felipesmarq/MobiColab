# Parâmetros do gerador de dados mockados (RD02, ADR 0006).
#
# Regra: todo parâmetro é um par {valor, fonte}. A fonte diz de onde o valor
# veio. Quando não há dado real, a fonte diz isso com todas as letras
# ("Suposição") — esses parâmetros são os primeiros a recalibrar quando houver
# relatos reais ou os dados pedidos à Prefeitura (spec, seção 12).
#
# Lembrete: o gerador só devolve os padrões programados aqui. As hipóteses
# H1–H4 do RD01 estão embutidas de propósito, para o pipeline e o dashboard
# terem o que mostrar. Achados sobre mock validam o pipeline e as
# visualizações, não o comportamento dos passageiros.

reprodutibilidade:
  semente:
    valor: 20261103
    fonte: "Escolha do grupo. Semente fixa: a mesma configuração gera sempre os mesmos dados."

periodo:
  dias:
    valor: 28
    fonte: "Escolha do grupo. Quatro semanas cobrem cada dia da semana quatro vezes, o bastante para a EDA (RD04)."

usuarios:
