name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  testes:
    name: Testes (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mobicolab
          POSTGRES_USER: mobicolab
          POSTGRES_PASSWORD: mobicolab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobicolab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: chave-somente-para-o-ci
      DATABASE_URL: postgres://mobicolab:mobicolab@localhost:5432/mobicolab
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Migrations em dia
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pytest com cobertura
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    name: Build do Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
