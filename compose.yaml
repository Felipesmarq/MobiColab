services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobicolab}
      POSTGRES_USER: ${POSTGRES_USER:-mobicolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobicolab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:-inseguro-somente-desenvolvimento}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: postgres://${POSTGRES_USER:-mobicolab}:${POSTGRES_PASSWORD:-mobicolab}@db:5432/${POSTGRES_DB:-mobicolab}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
